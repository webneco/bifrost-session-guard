name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOWORK: "off"
  GOTOOLCHAIN: go1.27.3

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    name: end-to-end against the real gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .work
          key: gateway-${{ runner.os }}-${{ hashFiles('BIFROST_VERSION', 'scripts/build-gateway.sh') }}
      - run: make e2e
      - run: make demo

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bifrost-session-guard .
      - run: docker run --rm bifrost-session-guard e2e
